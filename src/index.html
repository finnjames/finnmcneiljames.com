<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Finn James</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="I’m Finn, a software engineer & artist. I also write software for telescopes.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preload" href="/fonts.css" as="style">
  <script>
    (function () {
      function getInitialColorMode() {
        try {
          var persistedColorMode = window.localStorage.getItem("color-mode");
          if (persistedColorMode) return persistedColorMode;
          var mql = window.matchMedia("(prefers-color-scheme: dark)");
          if (typeof mql.matches === "boolean") {
            return mql.matches ? "dark" : "light";
          }
        } catch (e) {}
        return "light";
      }
      var colorMode = getInitialColorMode();
      document.documentElement.setAttribute("data-color-mode", colorMode);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
